<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7286055961358999" crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<title>Aviões e arte por Bruno Rhavani – Papa Charlie Golf TV</title>
<meta name="description" content="Galeria de aviões e artes feitas por Bruno Rhavani no Papa Charlie Golf TV.">
<meta property="og:title" content="Aviões e arte por Bruno Rhavani – Papa Charlie Golf TV">
<meta property="og:description" content="Galeria de aviões e artes feitas por Bruno Rhavani no Papa Charlie Golf TV.">
<style>
:root{--bg:#070d1a;--card:#0f1a30;--line:#1d2d4d;--tx:#e8eefc;--mut:#8fa3c7;--ac:#ffb020;--red:#ff3b3b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:rgba(7,13,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}.logo img{border-radius:50%;box-shadow:0 0 0 2px rgba(232,238,252,.35)}.logo span{white-space:nowrap;color:var(--tx)}
nav{margin-left:auto;display:flex;align-items:center}nav a{margin-left:20px;color:var(--mut);font-size:.92rem;display:inline-flex;align-items:center;line-height:1}nav a:hover,nav a.on{color:var(--ac)}
.hora{margin-left:22px;font-size:.9rem;color:var(--mut);white-space:nowrap}#clock{font-variant-numeric:tabular-nums;color:var(--tx);font-weight:700}
@media(max-width:720px){nav{display:none}.hora{margin-left:auto}}
@media(max-width:520px){.logo span{font-size:.8rem}}

.hero{padding:44px 0 10px;text-align:center}
.hero h1{font-family:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;font-size:clamp(2.2rem,6vw,4rem)}
.hero h1 span{color:var(--ac)}
.hero h1::after{content:"";display:block;width:84px;height:4px;margin:20px auto 0;border-radius:3px;background:linear-gradient(90deg,#ffb020,#ff7a18)}

section{padding:30px 0}
h2{font-size:1.5rem;margin-bottom:18px}h2::after{content:"";display:block;width:48px;height:3px;background:var(--ac);margin-top:8px;border-radius:2px}
.txt{max-width:820px;margin:auto}
.txt p{color:var(--mut);margin-bottom:14px;font-size:1.02rem}
.txt p strong{color:var(--tx)}
/* foto no meio do texto, estilo matéria de jornal */
.foto-art{margin:26px 0 28px}
.foto-art img{display:block;width:100%;max-height:640px;object-fit:cover;object-position:50% 28%;border-radius:12px;border:1px solid var(--line)}
.foto-art figcaption{margin-top:10px;padding-left:12px;border-left:3px solid var(--ac);color:var(--mut);font-size:.85rem;line-height:1.4}
.lista{list-style:none;padding:0;display:grid;gap:12px;margin:6px 0 16px}
.lista li{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:10px;padding:12px 16px;color:var(--mut)}
.lista li b{color:var(--tx)}
.destaque{background:linear-gradient(135deg,#13213f,#0f1a30);border:1px solid var(--line);border-radius:16px;padding:26px 24px;text-align:center;margin-top:10px}
.destaque p{color:var(--tx);margin:0;font-size:1.08rem}
.social{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.social a{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.92rem}
.social svg{width:20px;height:20px;flex:none}
.social a:hover{border-color:var(--ac);color:var(--ac)}
.redes{text-align:center}.redes h2::after{margin-left:auto;margin-right:auto}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}
.btn{padding:12px 22px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--ac);color:#1a1200;border-color:var(--ac)}
.btn:hover{filter:brightness(1.12)}
footer{border-top:1px solid var(--line);padding:26px 0;margin-top:20px;color:var(--mut);font-size:.85rem;text-align:center}

/* ====== MENU NO CELULAR ====== */
.menu-btn{display:none;margin-left:10px;flex:none;width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--tx);cursor:pointer;align-items:center;justify-content:center;padding:0}
.menu-btn i,.menu-btn i::before,.menu-btn i::after{display:block;width:18px;height:2px;border-radius:2px;background:currentColor;transition:transform .25s,opacity .2s,background .2s}
.menu-btn i{position:relative}.menu-btn i::before,.menu-btn i::after{content:"";position:absolute;left:0}
.menu-btn i::before{top:-6px}.menu-btn i::after{top:6px}
header.open .menu-btn i{background:transparent}
header.open .menu-btn i::before{transform:translateY(6px) rotate(45deg)}
header.open .menu-btn i::after{transform:translateY(-6px) rotate(-45deg)}
.menu-btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:720px){
  .menu-btn{display:inline-flex}
  header .hora{margin-left:auto;font-size:.8rem}
  header nav{display:flex;flex-direction:column;align-items:stretch;position:absolute;top:100%;left:0;right:0;margin:0;padding:6px 20px 12px;background:rgba(7,13,26,.98);border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .2s,visibility .2s}
  header.open nav{opacity:1;visibility:visible;transform:none}
  header nav a{margin:0;padding:15px 4px;border-bottom:1px solid var(--line);font-size:1rem}
  header nav a:last-child{border-bottom:0}
}
@media(max-width:400px){.logo{gap:8px}.logo img{width:36px;height:36px}.logo span{font-size:.7rem}header .hora{font-size:.72rem}.menu-btn{margin-left:8px;width:38px;height:38px}}
@media(max-width:520px){.btns{padding:0 4px}.btns .btn{flex:1 1 100%;text-align:center}}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.art{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;transition:transform .15s,border-color .15s;padding:0;text-align:left;color:inherit;font:inherit;display:block;width:100%}
.art:hover{transform:translateY(-3px);border-color:var(--ac)}
.art img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0b1328}
.art .inf{padding:12px 14px}.art h3{font-size:.98rem;line-height:1.35}.art small{display:block;color:var(--mut);margin-top:4px}
.vazio{grid-column:1/-1;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:38px 20px;color:var(--mut)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(3,6,14,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:82vh;border-radius:10px}.lb p{color:var(--mut);text-align:center;font-size:.9rem}

/* ====== MENU RADAR PCG (submenu) ====== */
header nav .dd{position:relative;margin-left:20px;display:inline-flex;align-items:center}
header nav .dd-btn{background:none;border:0;padding:0;margin:0;color:var(--mut);font:inherit;font-size:.92rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
header nav .dd-btn::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
header nav .dd:hover .dd-btn,header nav .dd.open .dd-btn,header nav .dd.on .dd-btn,header nav .dd-btn:focus-visible{color:var(--ac)}
header nav .dd-menu{position:absolute;top:calc(100% + 16px);left:-14px;min-width:290px;display:none;background:rgba(7,13,26,.98);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 30px rgba(0,0,0,.45);overflow:hidden;z-index:20}
header nav .dd-menu::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px}
header nav .dd:hover .dd-menu,header nav .dd.open .dd-menu{display:block}
header nav .dd-menu a{margin:0;padding:13px 16px;display:flex;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.9rem}
header nav .dd-menu a:last-child{border-bottom:0}
@media(max-width:720px){
  header nav .dd{display:block;margin:0}
  header nav .dd-btn{width:100%;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:1rem}
  header nav .dd-menu{position:static;min-width:0;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0 0 0 14px}
  header nav .dd-menu::before{display:none}
  header nav .dd:hover .dd-menu{display:none}
  header nav .dd.open .dd-menu{display:block}
  header nav .dd.open .dd-btn::after{transform:rotate(225deg)}
}
.vazio-img{grid-column:1/-1}.constr{display:block;width:100%;max-width:720px;height:auto;margin:0 auto;border-radius:18px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="/" class="logo"><img src="logo.png" alt="Papa Charlie Golf TV" width="44" height="44"><span>PAPA CHARLIE GOLF TV</span></a>
  <nav id="menu"><a href="/#aovivo">Direto pra pista ao vivo!</a><a href="/#videos">Vídeos</a><a href="/movimentos">Movimentos</a><div class="dd on"><button type="button" class="dd-btn" aria-expanded="false" aria-haspopup="true">Radar PCG</button><div class="dd-menu"><a href="/avioes" class="on">Aviões e arte por Bruno Rhavani</a><a href="/curiosidades">Curiosidades</a></div></div><a href="/sobre">Sobre</a><a href="/#parceiros">Parceiros</a></nav><div class="hora" title="Hora em Recife">🕐 <span id="clock">--:--:--</span></div><button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><i></i></button>
</div></header>

<main>
<div class="wrap hero">
  <h1>Aviões e arte por <span>Bruno Rhavani</span></h1>
</div>
<section><div class="wrap">
  <div class="galeria" id="galeria"><div class="vazio-img"><svg class="constr" viewBox="0 0 720 400" role="img" aria-label="Página em construção">
  <defs>
    <pattern id="haz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#ffb020"/><rect x="14" width="14" height="28" fill="#1a1200"/></pattern>
    <clipPath id="cpc"><rect width="720" height="400" rx="18"/></clipPath>
    <linearGradient id="skyc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13213f"/><stop offset="1" stop-color="#0b1328"/></linearGradient>
  </defs>
  <g clip-path="url(#cpc)">
    <rect width="720" height="400" fill="url(#skyc)"/>
    <rect y="0" width="720" height="26" fill="url(#haz)"/>
    <rect y="374" width="720" height="26" fill="url(#haz)"/>
    <rect y="326" width="720" height="48" fill="#172746"/>
    <line x1="0" y1="350" x2="720" y2="350" stroke="#e8eefc" stroke-width="3" stroke-dasharray="34 22" opacity=".55"/>
    <path d="M500 232 C 470 190 430 150 380 118" fill="none" stroke="#e8eefc" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity=".35"/>
    <g transform="translate(600 118) rotate(38)">
      <path d="M10 -14 L86 30 L86 44 L10 20Z M-10 -14 L-86 30 L-86 44 L-10 20Z" fill="#cfd9f1"/>
      <path d="M10 40 L36 58 L36 66 L10 54Z M-10 40 L-36 58 L-36 66 L-10 54Z" fill="#cfd9f1"/>
      <path d="M0 -64 C9 -64 11 -42 11 -22 L11 42 L0 60 L-11 42 L-11 -22 C-11 -42 -9 -64 0 -64Z" fill="#e8eefc"/>
      <rect x="-4" y="-50" width="8" height="12" rx="3" fill="#8fa3c7"/>
    </g>
    <g>
      <rect x="132" y="104" width="456" height="184" rx="16" fill="#1a1200" stroke="#ffb020" stroke-width="6"/>
      <rect x="148" y="120" width="424" height="152" rx="8" fill="none" stroke="#ffb020" stroke-width="2" stroke-dasharray="10 8" opacity=".6"/>
      <rect x="200" y="288" width="16" height="62" fill="#8fa3c7"/><rect x="504" y="288" width="16" height="62" fill="#8fa3c7"/>
      <text x="360" y="190" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-weight="800" font-size="50" letter-spacing="3" fill="#ffb020">PÁGINA EM</text>
      <text x="360" y="252" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-weight="800" font-size="66" letter-spacing="3" fill="#ffffff">CONSTRUÇÃO</text>
    </g>
    <g transform="translate(72 348)">
      <rect x="-44" y="-2" width="88" height="12" rx="3" fill="#2a3b60"/>
      <polygon points="-34,-2 34,-2 17,-84 -17,-84" fill="#ff7a18"/>
      <polygon points="-27,-30 27,-30 22,-50 -22,-50" fill="#ffffff"/>
    </g>
    <g transform="translate(648 348)">
      <rect x="-44" y="-2" width="88" height="12" rx="3" fill="#2a3b60"/>
      <polygon points="-34,-2 34,-2 17,-84 -17,-84" fill="#ff7a18"/>
      <polygon points="-27,-30 27,-30 22,-50 -22,-50" fill="#ffffff"/>
    </g>
  </g>
</svg></div></div>
</div></section>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada"><img id="lbImg" alt=""><p id="lbTxt"></p></div>

<footer><div class="wrap">Copyright © 2022 - <span id="ano">2026</span> Papa Charlie Golf. Todos os direitos reservados. · <a href="/privacidade" style="text-decoration:underline">Política de Privacidade</a></div></footer>

<script>
document.getElementById("ano").textContent = new Date().getFullYear();
const relogio = () => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Recife" }); };
relogio(); setInterval(relogio, 1000);
</script>
<script>
/* menu do celular */
(function(){
  const h=document.querySelector("header"), b=document.getElementById("menuBtn"); if(!h||!b) return;
  const set=o=>{h.classList.toggle("open",o); b.setAttribute("aria-expanded",o); b.setAttribute("aria-label",o?"Fechar menu":"Abrir menu");};
  b.addEventListener("click",e=>{e.stopPropagation(); set(!h.classList.contains("open"));});
  h.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",()=>set(false)));
  document.addEventListener("click",e=>{ if(!h.contains(e.target)) set(false); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") set(false); });
  matchMedia("(min-width:721px)").addEventListener("change",e=>{ if(e.matches) set(false); });
})();
</script>
<script>
/* GALERIA: para adicionar uma arte, coloque o arquivo na pasta do site e inclua uma linha aqui */
const ARTES = [
  // {src:"arte-airbus-a320.jpg", titulo:"Airbus A320neo – Azul", desc:"Descrição opcional"},
];
(function(){
  const g=document.getElementById("galeria"), lb=document.getElementById("lb"), li=document.getElementById("lbImg"), lt=document.getElementById("lbTxt");
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if(ARTES.length){
    g.innerHTML=ARTES.map((a,i)=>`<button type="button" class="art" data-i="${i}"><img loading="lazy" src="${esc(a.src)}" alt="${esc(a.titulo||"Arte de Bruno Rhavani")}"><div class="inf"><h3>${esc(a.titulo||"")}</h3><small>Arte: Bruno Rhavani${a.desc?" · "+esc(a.desc):""}</small></div></button>`).join("");
    g.addEventListener("click",e=>{const b=e.target.closest(".art"); if(!b) return; const a=ARTES[+b.dataset.i]; li.src=a.src; li.alt=a.titulo||""; lt.textContent=(a.titulo?a.titulo+" · ":"")+"Arte: Bruno Rhavani"; lb.classList.add("on");});
  }
  lb.addEventListener("click",()=>lb.classList.remove("on"));
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.classList.remove("on"); });
})();
</script>
<script>
/* submenu Radar PCG */
(function(){
  document.querySelectorAll("nav .dd").forEach(d=>{
    const b=d.querySelector(".dd-btn");
    b.addEventListener("click",e=>{e.stopPropagation(); const o=!d.classList.contains("open"); d.classList.toggle("open",o); b.setAttribute("aria-expanded",o);});
    document.addEventListener("click",e=>{ if(!d.contains(e.target)){ d.classList.remove("open"); b.setAttribute("aria-expanded","false"); } });
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ d.classList.remove("open"); b.setAttribute("aria-expanded","false"); } });
  });
})();
</script>
</body>
</html>
